<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundo Dog - Criar Conta</title>
  <link rel="stylesheet" href="./styles/style.css">
  <script src="./scripts/script.js" defer></script>
</head>
<body>
  <main class="signup-container">   
    <section class="image-side"></section>

    <section class="form-side">
      <div class="form-content">
        <h1 class="logo-title">Dog World</h1>
        <p class="subtitle">Crie sua conta</p>

        <form action="#" method="post">
          <div class="form-row">
            <div class="input-group">
              <label for="first_name"><span class="required">* </span>Nome:</label>
              <input type="text" id="first_name" name="first_name" required>
            </div>
            
            <div class="input-group">
              <label for="last_name">Sobrenome:</label>
              <input type="text" id="last_name" name="last_name">
            </div>
          </div>

          <div class="form-row">
            <div class="input-group">
              <label for="email"><span class="required">* </span>E-mail:</label>
              <input type="email" id="email" name="email" required>
            </div>
            
            <div class="input-group">
              <label for="phone">Telefone:</label>
              <input type="tel" id="phone" name="phone">
            </div>
          </div>

          <div class="form-row">
            <div class="input-group">
              <label for="password"><span class="required">* </span>Senha:</label>
              <input type="password" id="password" name="password" required minlength="8">
            </div>
            
            <div class="input-group">
              <label for="confirm_password"><span class="required">* </span>Confirmar senha:</label>
              <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
          </div>

          <div class="button-container">
            <button type="submit" class="btn-submit">Criar conta</button>
          </div>
        </form>
      </div>

      <footer>
        <a href="https://github.com/starfingar" target="_blank" rel="noopener noreferrer">
          <img src="./images/github-icon.svg" alt="GitHub" class="github-icon">
        </a>
      </footer>
    </section>
  </main>
</body>
</html>
